name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: develop
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write # CI結果の読み取りに加え、Android/iOS確認が必要な場合にclaude-android.yaml/claude-ios.yamlをworkflow_dispatchで起動するために必要
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: React with eyes to acknowledge the trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ github.event_name }}" in
            issue_comment)
              gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes || true
              ;;
            pull_request_review_comment)
              gh api "repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }}/reactions" -f content=eyes || true
              ;;
            issues)
              gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions" -f content=eyes || true
              ;;
          esac

      - name: Set up Flutter (from mobile/.fvmrc)
        id: flutter_setup
        uses: kuhnroyal/flutter-fvm-config-action@v3
        with:
          path: mobile/.fvmrc
          setup: "true"
          cache: "true"

      - name: Dart build_runner cache
        uses: actions/cache@v4
        with:
          path: mobile/.dart_tool
          key: dart-tool-${{ runner.os }}-${{ steps.flutter_setup.outputs.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-${{ steps.flutter_setup.outputs.FLUTTER_VERSION }}-

      - name: Install Flutter dependencies and generate code
        working-directory: mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Discard codegen changes to tracked files
        run: git checkout -- mobile/

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # CI結果の読み取りに加え、Android/iOS確認が必要な場合にclaude-android.yaml/claude-ios.yamlをworkflow_dispatchで起動するためにwriteが必要
          additional_permissions: |
            actions: write

          show_full_output: true

          prompt: |
            起動元コメントURL: ${{ (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && github.event.comment.html_url || (github.event_name == 'pull_request_review' && github.event.review.html_url || github.event.issue.html_url) }}
            対象種別: ${{ (github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)) && 'pr' || 'issue' }}
            対象番号: ${{ (github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review') && github.event.pull_request.number || github.event.issue.number }}

            起動元コメント本文:
            ${{ (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && github.event.comment.body || (github.event_name == 'pull_request_review' && github.event.review.body || github.event.issue.body) }}

            上記の依頼内容に対応してください。「起動元コメントURL」「対象種別」「対象番号」は、android-emu-verify-dispatch/ios-sim-verify-dispatchスキルでclaude-android.yaml/claude-ios.yamlを起動する際にそのまま使ってください（環境変数の展開やコマンドでの再取得は不要です）。

            このturnの最後には、対象種別が`pr`なら`gh pr comment <対象番号> --body '...'`、`issue`なら`gh issue comment <対象番号> --body '...'`で、依頼がどこまで完了したか（未完了の場合はその原因と次にすべきこと）を必ず起動元コメントへの返信として投稿してください。本文の先頭に`> 起動元コメントへの返信: <起動元コメントURL>`という引用行を入れてください。このコマンドは`gh pr comment`または`gh issue comment`だけから始まる単一のコマンドとして実行し、事前の疎通確認や他のコマンドとの連結は行わないでください。

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: >-
            --allowedTools "Task,
            Read,
            Edit,
            Write,
            WebFetch,
            Bash(git branch:*),
            Bash(git checkout:*),
            Bash(git switch:*),
            Bash(git push:*),
            Bash(git add:*),
            Bash(git commit:*),
            Bash(git fetch:*),
            Bash(flutter:*),
            Bash(dart:*),
            Bash(cd mobile && *),
            Bash(echo:*),
            Bash(sleep:*),
            Bash(grep:*),
            Bash(ls:*),
            Bash(mkdir:*),
            Bash(gh workflow run:*),
            Bash(gh pr view:*),
            Bash(gh issue view:*),
            Bash(gh pr comment:*),
            Bash(gh issue comment:*),
            Bash(gh pr create:*),
            Bash(gh pr merge:*),
            Bash(gh pr list:*),
            Bash(gh pr checks:*),
            Bash(gh api repos/${{ github.repository }}/branches/*/protection:*)"
