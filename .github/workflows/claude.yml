name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_API_LEVEL: "34"
      ANDROID_AVD_NAME: "ci_test"
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # コメント本文に "[ui-verify]" が含まれる場合のみ、この後のAndroidエミュレータ関連ステップを実行する。
      # エミュレータのセットアップ・起動は数分単位のコストがかかるため、既定ではスキップする。
      - name: Determine if UI verification (Android emulator) is requested
        id: ui_verify
        run: echo "enabled=${{ contains(github.event.comment.body, '[ui-verify]') || contains(github.event.review.body, '[ui-verify]') || contains(github.event.issue.body, '[ui-verify]') }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.ui_verify.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Enable KVM
        if: steps.ui_verify.outputs.enabled == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK
        if: steps.ui_verify.outputs.enabled == 'true'
        uses: android-actions/setup-android@v3

      # gradle-versionは指定しない（mobile/androidはGradle Wrapperを使うため、setup-gradle側が自動検出する）。
      - name: Gradle cache
        if: steps.ui_verify.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: AVD cache
        if: steps.ui_verify.outputs.enabled == 'true'
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-${{ env.ANDROID_API_LEVEL }}
          key: avd-${{ env.ANDROID_API_LEVEL }}

      - name: Create AVD
        if: steps.ui_verify.outputs.enabled == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          SYSTEM_IMAGE="system-images;android-${{ env.ANDROID_API_LEVEL }};default;x86_64"
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$SYSTEM_IMAGE"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" --verbose create avd -n "$ANDROID_AVD_NAME" -k "$SYSTEM_IMAGE" -d "pixel_6"

      # reactivecircus/android-emulator-runner は script: の実行が終わるとエミュレータをkillしてしまうため使わない。
      # ここでバックグラウンド起動し、後続の「Run Claude Code」ステップまで同一ジョブ内で生かしておく
      # （anthropics/claude-code-action は composite action なので同じランナー上で直接実行され、adb経由でこのエミュレータが見える）。
      - name: Start Android emulator (background)
        if: steps.ui_verify.outputs.enabled == 'true'
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$ANDROID_AVD_NAME" -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on > /tmp/emulator.log 2>&1 &
          disown
          # shellcheck disable=SC2016 # このコマンドはadb shell経由でAndroidデバイス側で評価される想定であり、CIランナー側で展開してはいけない
          "$ANDROID_HOME/platform-tools/adb" wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 3; done'
          "$ANDROID_HOME/platform-tools/adb" devices

      - name: Set up Flutter (from mobile/.fvmrc)
        if: steps.ui_verify.outputs.enabled == 'true'
        uses: kuhnroyal/flutter-fvm-config-action@v3
        with:
          path: mobile/.fvmrc
          setup: "true"
          cache: "true"

      - name: Install Flutter dependencies and generate code
        if: steps.ui_verify.outputs.enabled == 'true'
        working-directory: mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # adb/emulator/flutter/dart系のコマンドは、コメントに "[ui-verify]" を含めてAndroidエミュレータを
          # 有効化した場合に .claude/skills/flutter-ui-verify スキルが使用する。
          claude_args: '--allowedTools "Bash(git branch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git push:*),Bash(git add:*),Bash(git commit:*),Bash(git fetch:*),Bash(adb:*),Bash($ANDROID_HOME/*),Bash(flutter:*),Bash(dart:*)"'
