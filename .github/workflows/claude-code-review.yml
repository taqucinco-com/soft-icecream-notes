name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, edited]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review') &&
      (github.event.action != 'edited' || contains(github.event.pull_request.body, '[x] <!-- claude-review-check -->'))

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Uncheck the review-trigger checkbox
        if: github.event.action == 'edited' && contains(github.event.pull_request.body, '[x] <!-- claude-review-check -->')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | sed 's/- \[x\] <!-- claude-review-check -->/- [ ] <!-- claude-review-check -->/' > /tmp/pr-body.md
          gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/pr-body.md

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            Review the pull request "${{ github.repository }}/pull/${{ github.event.pull_request.number }}".
              - Provide a summary of the changes
              - Identify any potential issues or improvements
              - Suggest specific code changes if necessary
            You can use the plugin for reviewing with below command.

            レビューコメントは日本語で行ってください。

            '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # The code-review plugin's own command definition (code-review.md) declares
          # these exact Bash(gh ...) patterns plus the inline-comment MCP tool as its
          # required tools. claude-code-action denies arbitrary Bash by default, so
          # without this allowlist every `gh pr view` / `gh pr diff` / `gh pr comment`
          # call the plugin makes is denied and the review silently produces zero PR
          # comments, even though the step itself reports success. The plugin's review
          # flow is also built entirely on launching subagents ("Launch a haiku agent...",
          # "Launch 4 agents in parallel..."), so Task must be allowed too, or every
          # subagent launch is denied and the review produces nothing (observed as
          # permission_denials_count > 0 with very few turns in the run log).
          claude_args: '--allowedTools "Task,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"'
