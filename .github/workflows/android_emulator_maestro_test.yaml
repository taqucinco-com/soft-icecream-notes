name: Android emulator maestro test

on:
  workflow_dispatch:

jobs:
  android-emulator-maestro:
    # エミュレータのセットアップはandroid_emulator_dry_run.yamlと同じ構成。
    # 統合テストの代わりにMaestroでE2Eを流す（iOS版はios_simulator_maestro_test.yaml）。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: develop
    env:
      ANDROID_API_LEVEL: "34"
      ANDROID_AVD_NAME: "ci_test"
      ANDROID_AVD_TARGET: "google_apis"
      ARTIFACT_DIR: "maestro-artifacts"
      # brewのmaestro formulaは`depends_on "openjdk"`のため、JDKが入っていても
      # 別途openjdkを入れようとする。formulaがやっているのはリリースzipの展開だけなので、
      # zipを直接取得してこのjobのJDK 17で動かす（Maestroの要件は17+）。
      MAESTRO_VERSION: "2.10.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create mobile/.env.local from .env.sample
        env:
          GOOGLE_MAP_KEY_ANDROID: ${{ secrets.GOOGLE_MAP_KEY_ANDROID }}
          GOOGLE_MAP_KEY_IOS: ${{ secrets.GOOGLE_MAP_KEY_IOS }}
        run: |
          sed -e "s|{YOUR_GOOGLE_MAP_KEY_ANDROID_HERE}|$GOOGLE_MAP_KEY_ANDROID|" \
              -e "s|{YOUR_GOOGLE_MAP_KEY_IOS_HERE}|$GOOGLE_MAP_KEY_IOS|" \
              mobile/.env.sample > mobile/.env.local

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: "false"

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-${{ env.ANDROID_API_LEVEL }}
          key: avd-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_AVD_TARGET }}

      - name: Decode Debug Keystore
        run: echo "${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/ci-debug.keystore

      - name: Set up Flutter (from mobile/.fvmrc)
        id: flutter_setup
        uses: kuhnroyal/flutter-fvm-config-action@v3
        with:
          path: mobile/.fvmrc
          setup: "true"
          cache: "true"

      - name: Dart build_runner cache
        uses: actions/cache@v4
        with:
          path: mobile/.dart_tool
          key: dart-tool-${{ runner.os }}-${{ steps.flutter_setup.outputs.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-${{ steps.flutter_setup.outputs.FLUTTER_VERSION }}-

      - name: Install Flutter dependencies and generate code
        working-directory: mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # Maestroはビルドを行わず、インストール済みのアプリをappIdで起動するだけなので、
      # ここでAPKを作っておく。--debugなのでci-debug.keystoreで署名される。
      - name: Build debug APK
        working-directory: mobile
        run: |
          flutter build apk --debug --dart-define-from-file=.env.local
          ls -l build/app/outputs/flutter-apk/app-debug.apk

      # AVD作成（SDKコンポーネントの用意・system-image取得・avdmanager呼び出し・1回起動しての
      # ブート確認）はreactivecircusに任せる。killされるのはこのステップ内で起動した
      # エミュレータのプロセスだけで、AVD自体（~/.android/avd/配下のファイル）は残るため、
      # 後続のステップから同じ名前(avd-name)で自前起動できる。
      - name: create and check booting AVD (via reactivecircus/android-emulator-runner)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          force-avd-creation: false
          target: ${{ env.ANDROID_AVD_TARGET }}
          arch: "x86_64"
          script: echo "AVD created and boot-verified by reactivecircus."

      # ここから先は reactivecircus/android-emulator-runner に依存しない。
      - name: Start Android emulator (background, without reactivecircus)
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$ANDROID_AVD_NAME" -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > /tmp/emulator.log 2>&1 &
          disown
          # shellcheck disable=SC2016 # このコマンドはadb shell経由でAndroidデバイス側で評価される想定であり、CIランナー側で展開してはいけない
          "$ANDROID_HOME/platform-tools/adb" wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 3; done'
          "$ANDROID_HOME/platform-tools/adb" devices

      # フロー先頭のappIdと一致していないとMaestroが起動できないので、ここで突き合わせる。
      # AndroidのapplicationIdはiOSのbundle idと異なるため、フローも別ファイルを使う。
      - name: Install app on emulator
        working-directory: mobile
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" -s emulator-5554 install -r build/app/outputs/flutter-apk/app-debug.apk

          # ビルド成果物のpackage名を調べるのではなく、「フローが起動しようとするアプリが
          # 実際に端末に入っているか」を直接確かめる。aapt2の場所を探さずに済み、
          # インストールが成功したことの確認にもなる。
          FLOW_APP_ID=$(sed -n 's/^appId: *//p' test/e2e/maestro/page_transfar_android.yaml | head -1)
          echo "フローのappId: $FLOW_APP_ID"
          if "$ADB" -s emulator-5554 shell pm list packages | tr -d '\r' | grep -qx "package:$FLOW_APP_ID"; then
            echo "インストール済みであることを確認した"
          else
            echo "appIdのアプリが端末に見つからない: $FLOW_APP_ID" >&2
            "$ADB" -s emulator-5554 shell pm list packages | tr -d '\r' | grep taqucinco >&2 || true
            exit 1
          fi

      - name: Install Maestro
        run: |
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q /tmp/maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
          java -version
          # ここで`maestro --version`を叩くとJVMのコールドスタートで時間がかかる。
          # 次のステップでmaestroを実行するので、動かなければそこで分かる。
          ls -l "$HOME/maestro/bin/maestro"

      - name: Run maestro flow
        run: |
          mkdir -p "$ARTIFACT_DIR"
          maestro test mobile/test/e2e/maestro/page_transfar_android.yaml \
            --udid emulator-5554 \
            --debug-output "$ARTIFACT_DIR/debug" \
            --flatten-debug-output \
            --format JUNIT \
            --output "$ARTIFACT_DIR/report.xml"

      - name: Capture screenshot
        if: always()
        run: |
          mkdir -p "$ARTIFACT_DIR"
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 exec-out screencap -p > "$ARTIFACT_DIR/screencap.png"

      - name: Upload maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-test
          path: ${{ env.ARTIFACT_DIR }}

      - name: Dump emulator log on failure
        if: failure()
        run: |
          "$ANDROID_HOME/platform-tools/adb" devices || true
          cat /tmp/emulator.log || true
