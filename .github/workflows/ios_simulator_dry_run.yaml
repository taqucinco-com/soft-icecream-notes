name: iOS simulator dry run

on:
  workflow_dispatch:

jobs:
  ios-simulator-integration-test:
    # iOSビルドはmacOSランナーでしか動かない。Android版(android_emulator_dry_run.yaml)より
    # ビルドが重いのでtimeoutを長めに取る。
    runs-on: macos-15
    timeout-minutes: 60
    environment: develop
    env:
      # simctlで作成するシミュレータの名前。UDIDは作成時に取得してGITHUB_ENVへ入れる。
      SIMULATOR_NAME: "ci_test"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create mobile/.env.local from .env.sample
        env:
          GOOGLE_MAP_KEY_ANDROID: ${{ secrets.GOOGLE_MAP_KEY_ANDROID }}
          GOOGLE_MAP_KEY_IOS: ${{ secrets.GOOGLE_MAP_KEY_IOS }}
        run: |
          sed -e "s|{YOUR_GOOGLE_MAP_KEY_ANDROID_HERE}|$GOOGLE_MAP_KEY_ANDROID|" \
              -e "s|{YOUR_GOOGLE_MAP_KEY_IOS_HERE}|$GOOGLE_MAP_KEY_IOS|" \
              mobile/.env.sample > mobile/.env.local

      # ランナーイメージの更新でXcode/ランタイムのバージョンは変わるため、固定値ではなく
      # 利用可能なものから選ぶ。デバイスは"iPhone 16"があればそれを、無ければ任意のiPhoneを使う。
      #
      # 新規作成したデバイスの初回起動はData Migration等で1〜2分かかるが、`simctl boot`自体は
      # 即座に返る。ここでは起動を開始するだけにして、待ち合わせ(bootstatus)はテスト直前に行い、
      # 起動時間をFlutterセットアップ〜pod installの裏に隠す。
      - name: Create and boot iOS Simulator
        run: |
          xcrun simctl list runtimes

          RUNTIME_JSON=$(xcrun simctl list runtimes --json \
            | jq -c '[.runtimes[] | select(.isAvailable and (.identifier | contains("iOS")))]
                     | sort_by(.version | split(".") | map(tonumber)) | last')
          DEVICE_JSON=$(xcrun simctl list devicetypes --json \
            | jq -c '[.devicetypes[] | select(.productFamily == "iPhone")]
                     | (map(select(.name == "iPhone 16")) + .) | first')

          RUNTIME=$(jq -r '.identifier' <<< "$RUNTIME_JSON")
          RUNTIME_NAME=$(jq -r '.name' <<< "$RUNTIME_JSON")
          DEVICE_TYPE=$(jq -r '.identifier' <<< "$DEVICE_JSON")
          DEVICE_NAME=$(jq -r '.name' <<< "$DEVICE_JSON")

          UDID=$(xcrun simctl create "$SIMULATOR_NAME" "$DEVICE_TYPE" "$RUNTIME")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID"

          # 動的選択なので、どのOS/デバイスで実行したのかをログと実行サマリの両方に残す。
          echo "--- 選択したシミュレータ ---"
          echo "OS      : $RUNTIME_NAME ($RUNTIME)"
          echo "デバイス: $DEVICE_NAME ($DEVICE_TYPE)"
          echo "Xcode   : $(xcodebuild -version | tr '\n' ' ')"
          echo "UDID    : $UDID"

          {
            echo "### 実行したシミュレータ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| OS | $RUNTIME_NAME |"
            echo "| デバイス | $DEVICE_NAME |"
            echo "| Xcode | $(xcodebuild -version | head -1) |"
            echo "| UDID | \`$UDID\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # CocoaPodsのバージョンはGemfile(cocoapods ~> 1.17.0)で固定しているので、
      # ランナーにプリインストールされたpodではなくbundler経由のものを使う。
      - name: Set up Ruby (from .ruby-version)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      # ダウンロードキャッシュ(~/Library/Caches/CocoaPods)だけでなく、展開済みのmobile/ios/Podsも
      # キャッシュしてpod installを短縮する（Podsはgitignore対象で未追跡）。
      - name: CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            mobile/ios/Pods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Set up Flutter (from mobile/.fvmrc)
        id: flutter_setup
        uses: kuhnroyal/flutter-fvm-config-action@v3
        with:
          path: mobile/.fvmrc
          setup: "true"
          cache: "true"

      - name: Dart build_runner cache
        uses: actions/cache@v4
        with:
          path: mobile/.dart_tool
          key: dart-tool-${{ runner.os }}-${{ steps.flutter_setup.outputs.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-${{ steps.flutter_setup.outputs.FLUTTER_VERSION }}-

      - name: Install Flutter dependencies and generate code
        working-directory: mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # PodfileはFlutter/Generated.xcconfigの存在を要求するため、必ずflutter pub getの後に実行する。
      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: |
          pod --version
          bundle exec pod install

      # 先に起動を開始してあるので、ここは残りの起動待ちだけ。既に起動完了していれば即座に返る。
      # なお`flutter devices`はランナー上で2分以上かかることがあり（ネットワーク経由の実機探索）、
      # 情報表示にしかならないので通常時は実行しない。失敗時のログ採取ステップにのみ入れている。
      - name: Wait for simulator boot
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      # Androidと同じテストを同じ形で実行する。シミュレータ向けビルドなので署名は不要。
      - name: Run integration test on iOS simulator
        working-directory: mobile
        run: flutter test integration_test/app_test.dart -d "$SIMULATOR_UDID" --dart-define-from-file=.env.local

      # シミュレータ起動前に落ちた場合はUDIDが無いので撮らない（無駄な赤いステップを増やさない）。
      - name: Capture screenshot
        if: always() && env.SIMULATOR_UDID != ''
        run: |
          mkdir -p work
          xcrun simctl io "$SIMULATOR_UDID" screenshot work/screencap.png

      - name: Upload screenshot artifact
        if: always() && env.SIMULATOR_UDID != ''
        uses: actions/upload-artifact@v4
        with:
          name: screencap-ios
          path: work/screencap.png

      # 失敗時のみ。`flutter devices`は遅いが、デバイスが見つからない類の失敗ではここが効く。
      - name: Dump device info and simulator log on failure
        if: failure()
        working-directory: mobile
        run: |
          xcrun simctl list devices || true
          flutter devices || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 2m --style compact || true
