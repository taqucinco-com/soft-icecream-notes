name: Android emulator dry run

# claude.yml の [ui-verify] 有効時に実行されるAndroidエミュレータのセットアップ手順が
# 単体で正しく動作するかをworkflow_dispatchで検証するためのワークフロー。
# claude.yml本体には組み込まない。

on:
  workflow_dispatch:

jobs:
  android-emulator-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_API_LEVEL: "34"
      ANDROID_AVD_NAME: "ci_test"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # mobile/android/app/build.gradle.kts で sourceCompatibility/targetCompatibility/jvmTarget が
      # JVM_17 に固定されており、Gradle 9.1.0 自体もJDK 17未満では起動できないため必須。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # gradle-versionは指定しない（mobile/androidはGradle Wrapperを使うため、setup-gradle側が自動検出する）。
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-${{ env.ANDROID_API_LEVEL }}
          key: avd-${{ env.ANDROID_API_LEVEL }}

      - name: Create AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          SYSTEM_IMAGE="system-images;android-${{ env.ANDROID_API_LEVEL }};default;x86_64"
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$SYSTEM_IMAGE"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" --verbose create avd -n "$ANDROID_AVD_NAME" -k "$SYSTEM_IMAGE" -d "pixel_6"

      # reactivecircus/android-emulator-runner は script: の実行が終わるとエミュレータをkillしてしまうため使わない。
      # ここでバックグラウンド起動し、後続のテスト実行ステップまで同一ジョブ内で生かしておく。
      - name: Start Android emulator (background)
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$ANDROID_AVD_NAME" -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on > /tmp/emulator.log 2>&1 &
          disown
          # shellcheck disable=SC2016 # このコマンドはadb shell経由でAndroidデバイス側で評価される想定であり、CIランナー側で展開してはいけない
          "$ANDROID_HOME/platform-tools/adb" wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 3; done'
          "$ANDROID_HOME/platform-tools/adb" devices

      - name: Set up Flutter (from mobile/.fvmrc)
        uses: kuhnroyal/flutter-fvm-config-action@v3
        with:
          path: mobile/.fvmrc
          setup: "true"
          cache: "true"

      - name: Install Flutter dependencies and generate code
        working-directory: mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run integration test on Android emulator
        working-directory: mobile
        run: flutter test integration_test/app_test.dart -d emulator-5554

      - name: Dump emulator log on failure
        if: failure()
        run: cat /tmp/emulator.log || true
