name: Android emulator dry run

# claude.yml の [ui-verify] 有効時に実行されるAndroidエミュレータのセットアップ手順が
# 単体で正しく動作するかをworkflow_dispatchで検証するためのワークフロー。
# claude.yml本体には組み込まない。
#
# エミュレータの起動・破棄は reactivecircus/android-emulator-runner に任せる。
# 手動で `emulator` をバックグラウンド起動する方式を最初に試したが、
# taqucinco-com/android_emulator_workflow の実績あるワークフロー（7分31秒で完了）と
# ほぼ同時刻に実行したところ、手動起動の方だけ "Start Android emulator" ステップで
# ハングし続けた（14分経過しても完了せず）。reactivecircus側は起動・スナップショット
# キャッシュ・ブート待ち・破棄までを一括で面倒見てくれるため、そちらに合わせる。

on:
  workflow_dispatch:

jobs:
  android-emulator-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_API_LEVEL: "34"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # mobile/android/app/build.gradle.kts で sourceCompatibility/targetCompatibility/jvmTarget が
      # JVM_17 に固定されており、Gradle 9.1.0 自体もJDK 17未満では起動できないため必須。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # gradle-versionは指定しない（mobile/androidはGradle Wrapperを使うため、setup-gradle側が自動検出する）。
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-${{ env.ANDROID_API_LEVEL }}
          key: avd-${{ env.ANDROID_API_LEVEL }}

      - name: Set up Flutter (from mobile/.fvmrc)
        uses: kuhnroyal/flutter-fvm-config-action@v3
        with:
          path: mobile/.fvmrc
          setup: "true"
          cache: "true"

      - name: Install Flutter dependencies and generate code
        working-directory: mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          force-avd-creation: false
          target: "default"
          arch: "x86_64"
          script: echo "Generated AVD snapshot for caching."

      - name: Run integration test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          force-avd-creation: false
          target: "default"
          arch: "x86_64"
          working-directory: mobile
          script: |
            "$ANDROID_HOME/platform-tools/adb" devices
            flutter test integration_test/app_test.dart -d emulator-5554
