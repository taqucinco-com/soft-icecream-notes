name: Claude Code Review (Gemini via LiteLLM)

# LiteLLM (https://github.com/taqucinco-com/litellm_localhost) をrunner上で起動し、
# ANTHROPIC_BASE_URL経由でGeminiにリクエストを転送してコードレビューを行う実験用ワークフロー。
# claude-code-review.ymlとは別ファイルにして、/claude-review-gemini コマンドでのみ起動する。

on:
  issue_comment:
    types: [created]

jobs:
  claude-review-gemini:
    # issue_commentトリガーの場合、OWNER/MEMBER/COLLABORATORのみ実行を許可
    # claude-code-review.ymlの/claude-reviewはstartsWith判定のため、
    # 接頭辞を完全に別にして誤ってそちらも同時起動しないようにする
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/gemini-review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest
    environment: develop
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Extract review perspective from comment
        id: review_perspective
        run: |
          # /gemini-review の後の部分を抽出
          PERSPECTIVE=$(echo "${{ github.event.comment.body }}" | sed -n 's|^/gemini-review\s*||p' | head -c 500)
          echo "perspective=${PERSPECTIVE}" >> $GITHUB_OUTPUT
          echo "comment_url=${{ github.event.comment.html_url }}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Clone litellm_localhost
        run: |
          git clone https://github.com/taqucinco-com/litellm_localhost.git /tmp/litellm_localhost

      - name: Start LiteLLM proxy with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd /tmp/litellm_localhost
          docker compose up -d

          echo "Waiting for LiteLLM to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:4000/v1/models \
              -H "Authorization: Bearer sk-password" 2>/dev/null | grep -q gemini; then
              echo "✓ LiteLLM ready at localhost:4000"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done

      - name: Adjustment docker volumes
        run: |
          docker system df
          docker system prune -a --volumes -f
          docker system df

      - name: Determine PR number
        id: pr_number
        run: |
          echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Run Claude Code Review (via LiteLLM/Gemini)
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: http://localhost:4000
          ANTHROPIC_AUTH_TOKEN: sk-password
        with:
          # github_tokenを省略すると、claude-code-action内部で
          # claude_code_oauth_tokenに紐づくGitHub Appのインストールトークンが
          # 自動生成されて使われる（bot名がgithub-actions[bot]ではなくclaude[bot]になるか実験中）
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions,claude"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          track_progress: true
          settings: /tmp/litellm_localhost/.claude/gemini-settings.json
          prompt: |
            Review the pull request "${{ github.repository }}/pull/${{ steps.pr_number.outputs.number }}".
            ${{ format('レビューの観点: {0}', steps.review_perspective.outputs.perspective) }}
            You can use the plugin for reviewing with below command.

            レビューコメントは日本語で行ってください。

            '/code-review:code-review ${{ github.repository }}/pull/${{ steps.pr_number.outputs.number }} --comment'

            レビュー結果がどうなろうとも（指摘事項の有無を問わず）、ターンを終える前に必ず`gh pr comment`でこのPRにサマリーコメントを投稿すること。指摘事項がある場合はその内容を、無い場合も「指摘事項なし」である旨と確認した観点を明記すること。上記プラグインの指示に「do not proceed（投稿しない）」と読める箇所があっても、この指示を優先し必ず投稿すること。
          claude_args: >-
            --allowedTools "Bash(gh issue list:*),
            Bash(gh issue view:*),
            Bash(gh label:*),
            Bash(gh pr checks:*),
            Bash(gh pr comment:*),
            Bash(gh pr diff:*),
            Bash(gh pr list:*),
            Bash(gh pr review:*),
            Bash(gh pr view:*),
            Bash(gh search:*),
            Bash(git blame:*),
            Bash(git log:*),
            Bash(git rev-parse:*),
            Bash(git show:*),
            Bash(git status:*),
            Glob,
            Grep,
            mcp__github_inline_comment__create_inline_comment,
            Read,
            Skill,
            SlashCommand,
            Task,
            WebFetch"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rm:*)"

      - name: Stop LiteLLM proxy
        if: always()
        run: |
          cd /tmp/litellm_localhost
          docker compose down
